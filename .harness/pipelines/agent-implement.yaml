# Harness CI pipeline converted from .github/workflows/agent-implement.yml
pipeline:
  name: Run Implementation Agent
  identifier: Agent_Implement
  orgIdentifier: default
  projectIdentifier: muselab
  tags:
    source: github-actions
    workflow: agent-implement
  variables:
    - name: issue_number
      type: String
      description: Issue number to process. Leave empty to process the next eligible issue.
      value: <+input>
  properties:
    ci:
      codebase:
        connectorRef: account.MuseLabGitHub
        repoName: MuseLab
        build: <+input>
  stages:
    - stage:
        name: implement
        identifier: implement
        description: Run the implementation agent against GitHub issues.
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Action
                  name: Set up Python
                  identifier: setup_python
                  spec:
                    uses: actions/setup-python@v5
                    with:
                      python-version: "3.11"
              - step:
                  type: Run
                  name: Install ripgrep and gh
                  identifier: install_tools
                  spec:
                    shell: Sh
                    command: sudo apt-get update && sudo apt-get install -y ripgrep gh
              - step:
                  type: Run
                  name: Configure git author and push credentials
                  identifier: configure_git_author
                  spec:
                    shell: Sh
                    command: |-
                      REPO="$(git config --get remote.origin.url | sed -E 's#.*github.com[:/]([^/]+/[^/.]+)(\.git)?$#\1#')"
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
                    envVariables:
                      GITHUB_TOKEN: <+secrets.getValue("github_token")>
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: install_dependencies
                  spec:
                    shell: Sh
                    command: pip install -r scripts/agents/requirements.txt
              - step:
                  type: Run
                  name: Run Implementation Agent
                  identifier: run_implementation_agent
                  spec:
                    shell: Sh
                    command: python scripts/agents/implementation_agent.py "<+pipeline.variables.issue_number>"
                    envVariables:
                      PYTHONUNBUFFERED: "1"
                      GITHUB_WORKSPACE: /harness
                      GH_TOKEN: <+secrets.getValue("github_token")>
                      GITHUB_TOKEN: <+secrets.getValue("github_token")>
                      GH_PROJECT_TOKEN: <+secrets.getValue("project_token")>
                      OPENROUTER_API_KEY: <+secrets.getValue("openrouter_api_key")>
                      OPENROUTER_MODEL_IMPLEMENT: anthropic/claude-sonnet-4
                      OPENROUTER_TIMEOUT_IMPLEMENT: "900"
